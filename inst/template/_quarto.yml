# =====================================================================
# Template skripsi KHUSUS Program Studi D-IV Komputasi Statistik
# Politeknik Statistika STIS — mengikuti Pedoman Skripsi KS Edisi
# Keenam (2025). Bukan untuk program studi lain.
# =====================================================================
project:
  type: default
  output-dir: _output

# Metadata skripsi — diisi otomatis oleh buat_skripsi(), boleh diedit manual.
title: "{{JUDUL}}"
author: "{{NAMA}}"
date: "{{TAHUN}}"
lang: id

bibliography: referensi.bib
csl: apa-stis-id.csl

crossref:
  fig-prefix: "Gambar"
  tbl-prefix: "Tabel"
  eq-prefix: "Persamaan"
  sec-prefix: "Subbab"
  # Lingkungan matematika (judul + awalan rujukan dalam bahasa Indonesia)
  thm-prefix: "Teorema"
  lem-prefix: "Lema"
  cor-prefix: "Akibat"
  prp-prefix: "Proposisi"
  cnj-prefix: "Konjektur"
  def-prefix: "Definisi"
  exm-prefix: "Contoh"
  exr-prefix: "Latihan"
  thm-title: "Teorema"
  lem-title: "Lema"
  cor-title: "Akibat"
  prp-title: "Proposisi"
  cnj-title: "Konjektur"
  def-title: "Definisi"
  exm-title: "Contoh"
  exr-title: "Latihan"

format:
  pdf:
    documentclass: report
    papersize: a4
    pdf-engine: xelatex
    toc: false                # Daftar Isi disisipkan manual (lihat index.qmd)
    number-sections: true
    number-depth: 3
    fig-pos: "H"
    link-citations: true
    keep-tex: true
    include-in-header:
      - tex/preamble.tex
    include-before-body:
      - tex/00_frontmatter.tex

# Bibliografi diletakkan manual sebelum Lampiran (div #refs di index.qmd)
citeproc: true
